<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hiraishin Motion</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --surface: #f5f5f3;
      --border: rgba(0,0,0,0.08);
      --text-primary: #0d0d0d;
      --text-secondary: #777;
      --text-tertiary: #aaa;
      --accent: #e64036;
      --speed-progress: 9%;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    #logo-root {
      width: min(92vw, 806.4px);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #logo-root svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
      text-rendering: geometricPrecision;
    }

    .atomic-motions {
      display: flex;
      gap: 1.5rem;
      align-items: flex-end;
      justify-content: center;
      flex-wrap: wrap;
    }

    .atom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .atom-stage {
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .atom-stage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 260ms cubic-bezier(0.34,1.56,0.64,1);
      transform-origin: center;
    }

    .atom-label {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    .principles {
      max-width: 760px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      font-size: 11px;
      line-height: 1;
      padding: 5px 10px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .pill.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font: 12px/1.2 inherit;
      letter-spacing: 0.04em;
      padding: 8px 18px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text-primary);
      cursor: pointer;
    }

    button.primary {
      color: var(--bg);
      background: var(--text-primary);
      border-color: var(--text-primary);
    }

    .speed-control {
      width: min(340px, 80vw);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      border: 0.5px solid var(--border);
      border-radius: 999px;
      color: var(--text-secondary);
    }

    .speed-caption,
    .speed-value {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .speed-value {
      min-width: 46px;
      text-align: right;
      color: var(--text-primary);
      text-transform: none;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      flex: 1;
      min-width: 120px;
      height: 24px;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: grab;
      accent-color: var(--accent);
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--speed-progress), var(--border) var(--speed-progress), var(--border) 100%);
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      margin-top: -6.5px;
      border-radius: 50%;
      border: 2px solid var(--bg);
      background: var(--accent);
      box-shadow: 0 1px 6px rgba(0,0,0,0.18);
    }

    .footer {
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: center;
      line-height: 1.7;
    }

    .p2m-chromeless .atomic-motions,
    .p2m-chromeless .principles,
    .p2m-chromeless .controls,
    .p2m-chromeless .footer {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      /* Hiraishin 标志动效：swift / precise / electric。全部元素共用一个 1500ms 时钟，
         阶段用关键帧百分比表达；关键帧里的缓动全部写字面值（var() 在 @keyframes 里会被 Chromium 丢掉）。
         0–20% 预备：瓦片淡入并「蓄力」缩到 0.94
         20–70% 动作：上下两条黄边像闪电一样从画外劈下（左先右后，绿影随后），劈到底时镂空亮起 + 闪光 + 弹到 1.05 再回缩 0.985
         70–100% 收尾：1.004 → 1，落在静态矢量上 */
      :root {
        --p2m-duration: 1500ms;
        --p2m-ease-enter: cubic-bezier(0.16, 1, 0.3, 1);   /* Energetic 预设 */
        --p2m-ease-natural: cubic-bezier(0.4, 0, 0.2, 1);  /* 通用 natural，用于描线 */
        --p2m-overshoot: 1.05;                             /* Energetic 1.12 按 precise 收敛 */
      }
      #logo {
        transform-box: view-box;
        transform-origin: 512px 512px;
        animation: p2m-logo var(--p2m-duration) linear both;
      }
      #bolt-left, #bolt-right, #shadow-left, #shadow-right {
        stroke-dasharray: 1 1;      /* butt cap + 1 1：t=0 不漏墨 */
      }
      #bolt-left    { animation: p2m-draw-bl var(--p2m-duration) linear both; }
      #bolt-right   { animation: p2m-draw-br var(--p2m-duration) linear both; }
      #shadow-left  { animation: p2m-draw-sl var(--p2m-duration) linear both; }
      #shadow-right { animation: p2m-draw-sr var(--p2m-duration) linear both; }
      #bolt-cover   { animation: p2m-cover var(--p2m-duration) linear both; }
      #flash        { animation: p2m-flash var(--p2m-duration) linear both; }

      @keyframes p2m-logo {
        0%   { opacity: 0; transform: scale(0.86); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); /* --p2m-ease-enter */ }
        12%  { opacity: 1; transform: scale(0.97); animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1); /* 蓄力，对称 */ }
        20%  { opacity: 1; transform: scale(0.94); animation-timing-function: linear; /* 劈下期间保持，焦点给闪电 */ }
        50%  { opacity: 1; transform: scale(0.94); animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); /* --p2m-ease-enter：冲击 */ }
        60%  { transform: scale(1.05); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); /* --p2m-ease-natural */ }
        70%  { transform: scale(0.985); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        84%  { transform: scale(1.004); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes p2m-draw-bl {
        0%   { stroke-dashoffset: 1; }
        20%  { stroke-dashoffset: 1; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); /* --p2m-ease-natural */ }
        48%  { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes p2m-draw-br {
        0%   { stroke-dashoffset: 1; }
        24%  { stroke-dashoffset: 1; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        52%  { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes p2m-draw-sl {
        0%   { stroke-dashoffset: 1; }
        23%  { stroke-dashoffset: 1; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        51%  { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes p2m-draw-sr {
        0%   { stroke-dashoffset: 1; }
        27%  { stroke-dashoffset: 1; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        55%  { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes p2m-cover {
        0%   { opacity: 1; }
        46%  { opacity: 1; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); /* v4：提前到 46% 和描线收尾重叠，避免「停一下再闪」 */ }
        56%  { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes p2m-flash {
        0%   { opacity: 0; }
        47%  { opacity: 0; animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
        49%  { opacity: 0.15; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); /* v2：0.35 整片发灰，降到 0.15 */ }
        59%  { opacity: 0; }
        100% { opacity: 0; }
      }
    }
  </style>
</head>
<body>
  <main id="logo-root" aria-label="Animated logo" data-p2m-duration="1500"></main>

  <section class="atomic-motions" aria-label="Atomic motion studies">
    <div class="atom" data-atom="hover"><div class="atom-stage"></div><span class="atom-label">Hover</span></div>
    <div class="atom" data-atom="pulse"><div class="atom-stage"></div><span class="atom-label">Pulse</span></div>
    <div class="atom" data-atom="arc"><div class="atom-stage"></div><span class="atom-label">Arc</span></div>
    <div class="atom" data-atom="press"><div class="atom-stage"></div><span class="atom-label">Press</span></div>
  </section>

  <div class="principles" id="principlesRow">
    <span class="pill" data-p="squashstretch">Squash &amp; stretch</span>
    <span class="pill" data-p="anticipation">Anticipation</span>
    <span class="pill" data-p="staging">Staging</span>
    <span class="pill" data-p="followthrough">Follow through</span>
    <span class="pill" data-p="overlap">Overlapping</span>
    <span class="pill" data-p="slowinout">Slow in / out</span>
    <span class="pill" data-p="arc">Arc</span>
    <span class="pill" data-p="secondary">Secondary action</span>
    <span class="pill" data-p="timing">Timing</span>
    <span class="pill" data-p="appeal">Appeal</span>
  </div>

  <div class="controls">
    <button class="primary" id="btnReplay" type="button">Replay</button>
    <button id="btnSlow" type="button">Slow motion</button>
    <label class="speed-control" for="speedSlider">
      <span class="speed-caption">Speed</span>
      <input id="speedSlider" type="range" min="0.25" max="2.5" step="0.05" value="0.45" aria-label="Animation speed">
      <span class="speed-value" id="speedValue">0.45x</span>
    </label>
  </div>

  <p class="footer">Click the main logo to replay | Drag speed | Try atomic motions</p>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";
    const LOGO = {"tag":"svg","attrs":{"viewBox":"-64 -64 1152 1152"},"children":[{"tag":"defs","attrs":{},"children":[{"tag":"clipPath","attrs":{"id":"tile-clip"},"children":[{"tag":"rect","attrs":{"width":"1024","height":"1024","rx":"221.9"},"children":[]}]}]},{"tag":"g","attrs":{"id":"logo","clip-path":"url(#tile-clip)"},"children":[{"tag":"path","attrs":{"id":"tile","fill":"#2e382b","fill-rule":"evenodd","d":"M0 0 H1024 V1024 H0 Z M597.8 -100.0 L212.8 631.0 L460.4 596.9 L328.3 1124.0 L424.3 1124.0 L809.8 392.3 L562.5 426.3 L694.2 -100.0 Z"},"children":[]},{"tag":"path","attrs":{"id":"bolt-cover","d":"M597.8 -100.0 L212.8 631.0 L460.4 596.9 L328.3 1124.0 L424.3 1124.0 L809.8 392.3 L562.5 426.3 L694.2 -100.0 Z","fill":"#2e382b","stroke":"#2e382b","stroke-width":"4","stroke-linejoin":"round","opacity":"0"},"children":[]},{"tag":"path","attrs":{"id":"shadow-left","d":"M571.5 -50.0 L212.8 631.0 L460.4 596.9 L346.8 1050.0","fill":"none","stroke":"#8aa382","stroke-width":"22.0","stroke-linejoin":"round","transform":"translate(-24,25)","pathLength":"1"},"children":[]},{"tag":"path","attrs":{"id":"shadow-right","d":"M681.7 -50.0 L562.5 426.3 L809.8 392.3 L463.3 1050.0","fill":"none","stroke":"#8aa382","stroke-width":"22.0","stroke-linejoin":"round","transform":"translate(-24,25)","pathLength":"1"},"children":[]},{"tag":"path","attrs":{"id":"bolt-left","d":"M555.7 -20.0 L212.8 631.0 L460.4 596.9 L348.3 1044.0","fill":"none","stroke":"#f2cf73","stroke-width":"29.7","stroke-linejoin":"round","pathLength":"1"},"children":[]},{"tag":"path","attrs":{"id":"bolt-right","d":"M674.2 -20.0 L562.5 426.3 L809.8 392.3 L466.4 1044.0","fill":"none","stroke":"#f2cf73","stroke-width":"29.7","stroke-linejoin":"round","pathLength":"1"},"children":[]},{"tag":"rect","attrs":{"id":"flash","x":"0","y":"0","width":"1024","height":"1024","fill":"#fff6d8","opacity":"0"},"children":[]}]}]};
    const SVG_TEXT = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"-64 -64 1152 1152\"><style>:root,svg{--bg:#ffffff;--surface:#f5f5f3;--text-primary:#0d0d0d;--text-secondary:#777;--text-tertiary:#aaa;--logo-wordmark:#363e47;--accent:#e64036;--red:#e64036;--red-bright:#ff493f;}<\/style>\n  <defs><clipPath id=\"tile-clip\"><rect width=\"1024\" height=\"1024\" rx=\"221.9\"/><\/clipPath><\/defs>\n  <g id=\"logo\" clip-path=\"url(#tile-clip)\">\n    <path id=\"tile\" fill=\"#2e382b\" fill-rule=\"evenodd\" d=\"M0 0 H1024 V1024 H0 Z M597.8 -100.0 L212.8 631.0 L460.4 596.9 L328.3 1124.0 L424.3 1124.0 L809.8 392.3 L562.5 426.3 L694.2 -100.0 Z\"/>\n    <path id=\"bolt-cover\" d=\"M597.8 -100.0 L212.8 631.0 L460.4 596.9 L328.3 1124.0 L424.3 1124.0 L809.8 392.3 L562.5 426.3 L694.2 -100.0 Z\" fill=\"#2e382b\" stroke=\"#2e382b\" stroke-width=\"4\" stroke-linejoin=\"round\" opacity=\"0\"/>\n    <path id=\"shadow-left\" d=\"M571.5 -50.0 L212.8 631.0 L460.4 596.9 L346.8 1050.0\" fill=\"none\" stroke=\"#8aa382\" stroke-width=\"22.0\" stroke-linejoin=\"round\" transform=\"translate(-24,25)\" pathLength=\"1\"/>\n    <path id=\"shadow-right\" d=\"M681.7 -50.0 L562.5 426.3 L809.8 392.3 L463.3 1050.0\" fill=\"none\" stroke=\"#8aa382\" stroke-width=\"22.0\" stroke-linejoin=\"round\" transform=\"translate(-24,25)\" pathLength=\"1\"/>\n    <path id=\"bolt-left\" d=\"M555.7 -20.0 L212.8 631.0 L460.4 596.9 L348.3 1044.0\" fill=\"none\" stroke=\"#f2cf73\" stroke-width=\"29.7\" stroke-linejoin=\"round\" pathLength=\"1\"/>\n    <path id=\"bolt-right\" d=\"M674.2 -20.0 L562.5 426.3 L809.8 392.3 L466.4 1044.0\" fill=\"none\" stroke=\"#f2cf73\" stroke-width=\"29.7\" stroke-linejoin=\"round\" pathLength=\"1\"/>\n    <rect id=\"flash\" x=\"0\" y=\"0\" width=\"1024\" height=\"1024\" fill=\"#fff6d8\" opacity=\"0\"/>\n  <\/g>\n<\/svg>\n";
    const SVG_URI = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(SVG_TEXT);
    const DURATION = 1500;

    let playbackRate = 0.45;
    let pulseRaf = null;
    let arcRaf = null;
    window.__p2mReady = false;

    function createSvgNode(node) {
      const element = document.createElementNS(SVG_NS, node.tag);
      for (const [name, value] of Object.entries(node.attrs || {})) {
        element.setAttribute(name, value);
      }
      if (node.text) {
        element.appendChild(document.createTextNode(node.text));
      }
      for (const child of node.children || []) {
        element.appendChild(createSvgNode(child));
      }
      return element;
    }

    function heroAnimations() {
      const root = document.getElementById("logo-root");
      if (root.getAnimations) return root.getAnimations({ subtree: true });
      return document.getAnimations().filter(animation => {
        const target = animation.effect && animation.effect.target;
        return target && root.contains(target);
      });
    }

    function applyPlaybackRate() {
      for (const animation of heroAnimations()) {
        if (animation.updatePlaybackRate) animation.updatePlaybackRate(playbackRate);
        else animation.playbackRate = playbackRate;
      }
    }

    function renderHero() {
      const root = document.getElementById("logo-root");
      root.replaceChildren(createSvgNode(LOGO));
      const svg = root.querySelector("svg");
      if (svg) {
        svg.removeAttribute("width");
        svg.removeAttribute("height");
        svg.style.width = "100%";
        svg.style.height = "auto";
        svg.style.overflow = "visible";
      }
      requestAnimationFrame(() => requestAnimationFrame(applyPlaybackRate));
    }

    function flashPills(...names) {
      document.querySelectorAll(".pill").forEach(pill => pill.classList.remove("active"));
      names.forEach(name => {
        const pill = document.querySelector(`[data-p="${name}"]`);
        if (pill) pill.classList.add("active");
      });
    }

    function cyclePrinciples() {
      const phases = [
        ["staging", "timing"],
        ["anticipation", "squashstretch"],
        ["arc", "slowinout"],
        ["overlap", "followthrough"],
        ["appeal"]
      ];
      let i = 0;
      flashPills(...phases[0]);
      return setInterval(() => {
        i = (i + 1) % phases.length;
        flashPills(...phases[i]);
      }, Math.max(240, DURATION / phases.length / Math.max(playbackRate, 0.25)));
    }

    let pillTimer = null;
    function replayMain() {
      clearInterval(pillTimer);
      renderHero();
      pillTimer = cyclePrinciples();
      setTimeout(() => {
        clearInterval(pillTimer);
        document.querySelectorAll(".pill").forEach(pill => pill.classList.remove("active"));
      }, DURATION / Math.max(playbackRate, 0.25) + 600);
    }

    function formatSpeed(rate) {
      return `${rate.toFixed(2)}x`;
    }

    function updateSpeedUI() {
      const slider = document.getElementById("speedSlider");
      const value = Number(slider.value);
      const min = Number(slider.min);
      const max = Number(slider.max);
      const progress = ((value - min) / (max - min)) * 100;
      document.getElementById("speedValue").textContent = formatSpeed(value);
      slider.style.setProperty("--speed-progress", `${progress}%`);
      const slow = value <= 0.251;
      const btnSlow = document.getElementById("btnSlow");
      btnSlow.textContent = slow ? "Normal speed" : "Slow motion";
      btnSlow.style.background = slow ? "var(--surface)" : "";
      btnSlow.style.borderColor = slow ? "var(--text-secondary)" : "";
    }

    function setPlaybackRate(rate, replay = false) {
      const slider = document.getElementById("speedSlider");
      const min = Number(slider.min);
      const max = Number(slider.max);
      playbackRate = Math.min(max, Math.max(min, Number(rate)));
      slider.value = String(playbackRate);
      updateSpeedUI();
      applyPlaybackRate();
      if (replay) replayMain();
    }

    function setupAtomImages() {
      document.querySelectorAll(".atom-stage").forEach(stage => {
        const img = new Image();
        img.src = SVG_URI;
        img.alt = "";
        stage.appendChild(img);
      });
    }

    function setupAtoms() {
      const hover = document.querySelector('[data-atom="hover"] img');
      const pulse = document.querySelector('[data-atom="pulse"] img');
      const arc = document.querySelector('[data-atom="arc"] img');
      const press = document.querySelector('[data-atom="press"] img');

      hover.parentElement.addEventListener("mouseenter", () => {
        flashPills("squashstretch", "appeal");
        hover.style.transform = "scale(1.08) rotate(-1.5deg)";
      });
      hover.parentElement.addEventListener("mouseleave", () => {
        hover.style.transform = "scale(1)";
      });

      function pulseTick(ts) {
        const p = (Math.sin(ts / 900) + 1) / 2;
        pulse.style.transform = `scale(${1 + 0.1 * p})`;
        pulseRaf = requestAnimationFrame(pulseTick);
      }
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        pulseRaf = requestAnimationFrame(pulseTick);
      }

      let arcAngle = -14;
      let arcVel = 0;
      function arcTick() {
        arcVel += (0 - arcAngle) * 0.08;
        arcVel *= 0.86;
        arcAngle += arcVel;
        arc.style.transform = `rotate(${arcAngle}deg)`;
        arcRaf = requestAnimationFrame(arcTick);
      }
      arc.parentElement.addEventListener("mouseenter", () => {
        flashPills("arc", "anticipation", "appeal");
        cancelAnimationFrame(arcRaf);
        arcAngle = 28;
        arcVel = 0;
        arcTick();
      });
      arc.parentElement.addEventListener("mouseleave", () => {
        arcAngle = 0;
      });

      press.parentElement.addEventListener("mousedown", () => {
        flashPills("squashstretch", "anticipation");
        press.style.transform = "scaleX(1.10) scaleY(0.88)";
      });
      ["mouseup", "mouseleave"].forEach(ev => {
        press.parentElement.addEventListener(ev, () => {
          press.style.transform = "scale(1)";
        });
      });
    }

    function applyQaMode() {
      const params = new URLSearchParams(location.search);
      const seekMs = params.get("t");
      const staticMode = params.get("static");
      if (seekMs === null && staticMode === null) {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          applyPlaybackRate();
          window.__p2mReady = true;
        }));
        return;
      }

      document.documentElement.classList.add("p2m-chromeless");
      cancelAnimationFrame(pulseRaf);
      cancelAnimationFrame(arcRaf);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        for (const animation of heroAnimations()) {
          if (staticMode !== null) {
            try {
              animation.finish();
            } catch (err) {
              animation.cancel();
            }
          } else {
            animation.pause();
            animation.currentTime = Number(seekMs);
          }
        }
        window.__p2mReady = true;
      }));
    }

    document.getElementById("btnReplay").addEventListener("click", replayMain);
    document.getElementById("logo-root").addEventListener("click", replayMain);
    document.getElementById("speedSlider").addEventListener("input", event => {
      setPlaybackRate(event.target.value, false);
    });
    document.getElementById("btnSlow").addEventListener("click", () => {
      const slow = Number(document.getElementById("speedSlider").value) <= 0.251;
      setPlaybackRate(slow ? 0.45 : 0.25, true);
    });

    setupAtomImages();
    setupAtoms();
    setPlaybackRate(0.45, false);
    renderHero();
    applyQaMode();
  </script>
</body>
</html>
